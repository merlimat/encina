[package]
name = "encina"
# The release workflow publishes the version its tag names. See
# .github/workflows/release.yml.
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.99"
description = "Embedded ordered key-value store built on the compio runtime"
license = "Apache-2.0"
repository = "https://github.com/merlimat/encina"
keywords = ["database", "key-value", "btree", "embedded", "io-uring"]
categories = ["database-implementations", "asynchronous"]

[dependencies]
compio = { version = "0.19.2", features = ["fs"] }
crc32c = "0.6"
nanometer = "0.1"
# The version nanometer pins.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["metrics"] }

[dev-dependencies]
compio = { version = "0.19.2", features = ["macros"] }
# Collects the metrics the tests check, with a reader they keep a handle to.
opentelemetry_sdk = { version = "=0.33.1", features = ["metrics", "experimental_metrics_custom_reader"] }
proptest = "1"
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"

# cargo fuzz builds with `--cfg fuzzing`, which compiles src/fuzz.rs for the
# targets in fuzz/.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# The encina command lives in cli/, so the library doesn't depend on its argument
# parser. As a default member, cargo builds and tests it from here too.
[workspace]
members = ["cli"]
default-members = [".", "cli"]
