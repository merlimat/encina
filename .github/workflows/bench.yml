name: Bench

# bench/ is a workspace of its own, so the other workflows don't build it. It
# builds encina from src/ and compiles RocksDB's C++, so this runs only when one
# of the two may have changed.
on:
  pull_request:
    paths:
      - bench/**
      - src/**
      - Cargo.toml
      - .github/workflows/bench.yml

permissions:
  contents: read

# A new push to a pull request cancels its previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      # Without debug info, RocksDB's objects, and so the cache, are a fifth of
      # the size.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - run: cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings

  # Temporary: the same job with debug info, to compare times and cache sizes.
  clippy-debug:
    name: Clippy (debug info)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench
      - run: cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings
