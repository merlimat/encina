name: Fuzz nightly

# Runs each fuzz target in fuzz/ for an hour every night (DESIGN.md §11), on every
# core of the runner, from the corpus the night before left, and saves the corpus
# it grew for the next night and for pull requests (fuzz.yml).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [meta_round_trip, node, node_round_trip, open, value_leaf, value_leaf_round_trip]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Caches can't be overwritten, so each night saves a new one, and the next
      # restores the newest.
      - name: Restore the corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # cargo-fuzz's release is built for musl, and builds for its own target
      # unless told another: AddressSanitizer needs the host's, with glibc.
      - name: Target the host
        run: |
          echo "HOST=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
      # An input that runs for 30 seconds is a hang.
      - name: Fuzz for an hour
        run: |
          mkdir -p "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET"
          cargo fuzz run --target "$HOST" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time=3600 -timeout=30 -fork="$(nproc)"
      # Keeps the inputs that reach new coverage, so the corpus doesn't grow
      # without bound. A crash leaves it as useful as before.
      - name: Minimize the corpus
        if: ${{ !cancelled() }}
        run: cargo fuzz cmin --target "$HOST" "$TARGET" "fuzz/corpus/$TARGET" -- -timeout=30
      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the input that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
      - name: Say how to reproduce it
        if: failure()
        run: >
          echo "The fuzz-$TARGET artifact holds the input that failed. Reproduce it with
          \`cargo +nightly fuzz run $TARGET <file>\`." >> "$GITHUB_STEP_SUMMARY"
