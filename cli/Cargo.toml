# The encina command. See README.md.
[package]
name = "encina-cli"
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.99"
description = "Puts, gets, scans and deletes the entries of an encina store"
license = "Apache-2.0"
repository = "https://github.com/merlimat/encina"
keywords = ["database", "key-value", "cli"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "encina"
path = "src/main.rs"
# Its docs would take the place of the library's, which has the same name.
doc = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
compio = "0.19.2"
# The release workflow sets this version along with the crates' own.
encina = { path = "..", version = "0.0.0-dev" }

[dev-dependencies]
compio = { version = "0.19.2", features = ["macros"] }
tempfile = "3"
