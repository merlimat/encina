# Compares encina with RocksDB. See README.md.
[package]
name = "encina-bench"
version = "0.1.0"
edition = "2024"
publish = false

# Not part of the encina crate, which then builds without RocksDB.
[workspace]

[dependencies]
compio = "0.19.2"
encina = { path = ".." }
libc = "0.2"
# LZ4 is the only compression the benchmark uses.
rocksdb = { version = "0.25", default-features = false, features = ["lz4", "bindgen-runtime"] }

[profile.release]
lto = "fat"
codegen-units = 1
